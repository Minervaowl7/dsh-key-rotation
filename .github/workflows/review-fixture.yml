name: PR 19 audit fixture
on:
  push:
    branches: [fix/pr19-behavioral-audit]
    paths: [.github/workflows/review-fixture.yml]
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Archive exact source and install test-only libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-artifact/deps
          git archive HEAD > audit-artifact/source.tar
          printf '{"private":true,"type":"module"}\n' > audit-artifact/deps/package.json
          npm install --prefix audit-artifact/deps --ignore-scripts --no-audit --no-fund react@18.3.1 react-test-renderer@18.3.1
          node --version > audit-artifact/runtime.txt
          git rev-parse HEAD >> audit-artifact/runtime.txt
          tar -C audit-artifact -czf audit-fixture.tar.gz source.tar deps runtime.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr19-audit-fixture
          path: audit-fixture.tar.gz
          retention-days: 3
          if-no-files-found: error
